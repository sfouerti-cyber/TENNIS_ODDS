<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#081f3d"/>
  <meta name="description" content="BTA Tennis League — predict winners, build parlays, follow your players, and win virtual credits."/>
  <title>BTA Tennis | League Sportsbook</title>
  <link rel="icon" href="/assets/bta-logo.webp" type="image/webp"/>
  <link rel="stylesheet" href="/style.css"/>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="top-ticker"><span class="live-dot"></span> BTA TENNIS TOUR <span class="ticker-dot">✦</span> WEEKLY MATCHUPS <span class="ticker-dot">✦</span> PLAY FOR BRAGGING RIGHTS <span class="top-ticker-right">NON-REDEEMABLE BTA CREDITS</span></div>
  <header class="site-header">
    <div class="brand" role="button" tabindex="0" id="brandHome"><img src="/assets/bta-logo.webp" alt="BTA logo"/><span><b>BTA</b><small>SPORTSBOOK</small></span></div>
    <nav class="header-tabs" aria-label="Site navigation"><button class="nav-link active" data-route="markets">Sportsbook</button><button class="nav-link" data-route="bets">My Bets</button><button class="nav-link" data-route="standings">Standings</button><button class="nav-link" data-route="futures">Futures</button><button class="nav-link" data-route="credits">Credits</button><button class="nav-link" data-route="activity">Activity</button></nav>
    <div class="header-right"><span class="pill-free"><span class="live-dot"></span> VIRTUAL CREDITS</span><button class="wallet" id="walletButton">◎ <span id="balanceLabel">—</span> <small>CR</small></button><button class="account-btn" id="accountButton">Sign in <span>↗</span></button></div>
  </header>
  <nav class="mobile-nav" aria-label="Mobile site navigation">
    <button data-route="markets" class="active">🎾 Matchups</button>
    <button data-route="bets">◈ My Bets</button>
    <button data-route="standings">▤ Standings</button>
  <button class="nav-link" data-route="futures">Futures</button><button class="nav-link" data-route="credits">Credits</button><button class="nav-link" data-route="activity">Activity</button></nav>
  <div class="layout">
    <aside class="left-sidebar">
      <div class="sidebar-section-label">DISCOVER</div>
      <button class="side-item active" data-route="markets"><span class="side-ico">◈</span> Live Markets <span class="side-chevron">›</span></button>
      <button class="side-item" data-route="bets"><span class="side-ico">▤</span> My Bet History</button>
      <button class="side-item" data-route="standings"><span class="side-ico">▥</span> League Standings</button>
      <button class="side-item" data-route="futures">Futures</button><button class="side-item" data-route="credits">Credits</button><button class="side-item" data-route="activity">Activity</button><div class="sidebar-divider"></div>
      <div class="sidebar-section-label">YOUR LEAGUE</div>
      <div class="league-sidebar-card"><span class="tag-sport">🎾 TENNIS</span><strong>BTA Tennis League</strong><span>2026 season</span><div class="side-stats"><span><strong id="leftMatchCount">5</strong> Matchups</span><span><strong>10</strong> Players</span></div></div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section-label">FEATURED MATCH</div>
      <div class="side-feature"><div class="feature-images"><img src="/assets/fish.webp" alt="Fish"/><span>VS</span><img src="/assets/vic.webp" alt="Vic"/></div><strong>Fish vs Vic</strong><span>Two contenders. One winner.</span></div>
      <div class="side-bottom"><span class="shield">✓</span><p>Just a game.<br><strong>All stakes are virtual.</strong></p></div>
    </aside>
    <main class="content" id="mainContent" tabindex="-1"></main>
    <aside class="slip-sidebar" id="slipSidebar"><div id="slipContent"></div></aside>
  </div>
  <button id="mobileSlipButton" class="mobile-slip-btn" aria-label="Open parlay slip"><span>◎ Bet Slip <b id="mobileSlipCount">0</b></span><span id="mobileSlipOdds">Add picks ↗</span></button>
  <div id="modalLayer"></div>
  <div id="toastContainer" role="status" aria-live="polite"></div>
</body>
</html>
